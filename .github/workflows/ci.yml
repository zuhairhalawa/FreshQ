name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify the packed package installs and runs outside the repo
        run: npm run verify:package

  live:
    # Read-only smoke test against the real GitHub API using the workflow's own short-lived token.
    name: Live API smoke test (informational)
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true # the live API changes minute to minute; do not block merges on it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Live read-only integration checks
        run: npm run test:integration
        env:
          GH_TOKEN: ${{ github.token }}
